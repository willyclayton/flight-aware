# One-click deploy: https://render.com/deploy
services:
  - type: web
    name: flight-aware
    runtime: node
    plan: free
    region: oregon
    # --include=dev: Render sets NODE_ENV=production for the whole
    # service lifecycle, which would otherwise skip vite/typescript types.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "22.16.0"
